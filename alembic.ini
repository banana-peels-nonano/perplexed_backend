# Alembic configuration. Run commands from the repo root, e.g.:
#   alembic upgrade head          apply all migrations
#   alembic downgrade -1          undo the last one
#   alembic revision --autogenerate -m "add x"   draft a migration from model changes (then READ it)
#   alembic check                 fail if models and migrations disagree

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Left empty on purpose: alembic/env.py reads DATABASE_URL from settings (.env),
# so the password lives in exactly one place. Tests pass an explicit test URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
