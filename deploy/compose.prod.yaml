# From deploy/: docker compose --env-file .env -f compose.prod.yaml up -d --build --wait

name: perplexed

# ponytail: rotated + compressed logs, capped at ~50MB per container. Raise max-file if you need more history.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"


services:
  db:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: perplexed
      POSTGRES_DB: perplexed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perplexed -d perplexed"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    logging: *logging
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://perplexed:${POSTGRES_PASSWORD}@db:5432/perplexed
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in deploy/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_CASE: ${SEED_CASE:-}
      EVENT_NAME: ${EVENT_NAME:-PERPLEXED 2.0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - ../content:/app/content:ro # the real case lives here on the server, never in git
    networks:
      default: {}
      web:
        aliases:
          - perplexed-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:8000/healthz'',timeout=3)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


networks:
  web:
    external: true

volumes:
  pgdata:
