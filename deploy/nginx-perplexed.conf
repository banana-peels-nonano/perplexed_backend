# Only if the server already runs nginx on 80/443 (then start compose WITHOUT --profile caddy).
# Put this in /etc/nginx/sites-available/perplexed, symlink it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d perplexed.example.org      (HTTPS, if certbot is set up)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name perplexed.example.org;   # <- our subdomain

    client_max_body_size 25m;            # document uploads (nginx's default is 1 MB)

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                      # the app checks WebSocket Origin against Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;           # without these two lines, live
        proxy_set_header Connection $connection_upgrade;  # updates silently never connect
        proxy_read_timeout 3600s;                         # keep sockets open through a round
    }
}
