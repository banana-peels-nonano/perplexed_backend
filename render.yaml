# Free staging on Render (render.com → New → Blueprint → pick this repo).
# Not for the event: the free web service sleeps after 15 idle minutes (~1 min to wake),
# has 0.1 CPU, and the free database is deleted after 30 days. It's a URL to click around.
services:
  - type: web
    name: perplexed-staging
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: perplexed-staging-db, property: connectionString }
      - key: ADMIN_TOKEN
        generateValue: true # read it in the Render dashboard → Environment
      - key: ANTHROPIC_API_KEY
        sync: false # Render asks for it when you create the blueprint
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_CASE
        value: tests/fixtures/northfield.toml # placeholder case; never the real one here
      - key: EVENT_NAME
        value: PERPLEXED staging
databases:
  - name: perplexed-staging-db
    plan: free
    databaseName: perplexed
    user: perplexed
