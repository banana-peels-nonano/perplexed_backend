# ------------------------------------------------------------------ judge-only
[clue]
C01 = "Finance cut the QA budget by 15 percent, and the CFO cancelled the QA staffing review."
C02 = "Inspection sampling dropped from 1 in 20 to 1 in 80 on 1 April."
C03 = "X-series drives the warranty spike (412 of 690 claims; provisions 0.9 to 2.1 crore)."
C04 = "The failures trace to resin lots RL-2207 to RL-2219 with moisture voids."
C05 = "Failed lots were released without retests on the ops head's instruction."
C06 = "Kestrel warned about moisture; Northfield skipped pre-drying (cross-company)."
C07 = "Kestrel released out-of-spec lots under a waiver Northfield requested (partner side)."

[[contradiction]]
stakeholder = "cfo"
claim = "The QA reduction was a modest trim, around 5 percent."
refuted_by = ["A-FIN-002#2"]

[[contradiction]]
stakeholder = "ops_head"
claim = "You have never told anyone to skip retests."
refuted_by = ["A-COM-001#3", "A-OPS-002#2"]

[[contradiction]]
stakeholder = "ops_head"
claim = "QA was informed about Kestrel's resin moisture notice."
refuted_by = ["A-OPS-003#2"]

[[contradiction]]
stakeholder = "cfo"
claim = "The warranty spike is caused by out-of-spec resin from Kestrel."
refuted_by = ["A-OPS-002#3", "A-OPS-003#1"]   # partly true, but Northfield skipped pre-drying

