# PERPLEXED backend test fixture: one company (Northfield), three stakeholders,
# 8 records, 25 passages. Plus a one-stakeholder stub company (Kestrel) that exists
# only so company-isolation tests have something to be isolated from.
#
# This is fictional TEST DATA for development. It is safe to commit.
# Real competition content goes in content/ (git-ignored), in this same format.
#
# Conventions
#   trust tiers   : guarded < neutral < open
#   access modes  : deny < aware < paraphrase < quote
#                   deny        = never in the model's context (also the default when
#                                 a passage is not listed for a stakeholder)
#                   aware       = title + one line only; may not be cited
#                   paraphrase  = text in context; reply must not contain its fingerprints
#                   quote       = text in context; may be quoted verbatim
#   unlock rules  : every rule on an access entry must pass, or the passage is not eligible
#   judge-only    : clue, truth, contradictions. Never sent to a model or a participant.

schema_version = 1
case_id = "fixture-northfield"
brief = "Two companies, one supply chain. Interview the people; the records stay locked."
phases = ["briefing", "solo", "alliance_window", "joint", "submission_closed", "round2"]
labels = ["specific", "broad", "vague", "repetitive", "hostile", "prompt_attack", "off_topic"]

# ------------------------------------------------------------------ companies
[company.A]
name = "Northfield Components"
brief = "Northfield's warranty claims have doubled. The board wants to know why."
departments = ["finance", "operations"]
topics = ["revenue", "warranty", "qa_budget", "inspection", "resin", "supplier",
          "retests", "shipments", "partner_pricing", "board", "overtime"]

[company.B]
name = "Kestrel Polymers"
brief = "Kestrel supplies resin to Northfield and is being blamed for the failures."
departments = ["quality"]
topics = ["resin", "lot_release", "waiver"]

# ------------------------------------------------------------------ stakeholders
[stakeholder.cfo]
company = "A"
department = "finance"
name = "Ritu Malhotra"
role = "Chief Financial Officer"
canary = "NF-CFO-7Q2X"
persona = """Precise, defensive about her forecasts, proud of cost discipline. Impatient with
vague questions; warmer with people who bring numbers. Wants the partnership with Kestrel
to survive the board review."""
beliefs = [
  "The warranty spike is caused by out-of-spec resin from Kestrel Polymers.",
  "The QA reduction this year was a modest trim, around 5 percent.",
  "Operations has never told you the QA changes caused a capacity problem.",
]

[stakeholder.cfo.look]  # portrait art direction; the other stakeholders are drawn from their ids
skin = 2
hair = "bob"
hair_color = "dark_brown"
glasses = "half"
outfit = "blazer"
outfit_color = "#22324A"
background = "#B23A5C"
expression = "stern"

[stakeholder.ops_head]
company = "A"
department = "operations"
name = "Arjun Rao"
role = "Head of Plant Operations"
canary = "NF-OPS-3K9M"
persona = """Blunt, under pressure to hit shipment targets, protective of his team. Blames
finance for every constraint. Gets curt when asked about the shop floor."""
beliefs = [
  "Finance's budget cut forced the inspection sampling change.",
  "You have never told anyone to skip retests.",
  "QA was informed about Kestrel's resin moisture notice.",
]

[stakeholder.qa_lead]
