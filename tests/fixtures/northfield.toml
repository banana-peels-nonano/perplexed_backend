]

[stakeholder.kestrel_qc]
company = "B"
department = "quality"
name = "Daniel Okafor"
role = "Quality Control Manager"
canary = "KP-QCM-8W4E"
persona = "Isolation stub. Methodical and cautious."
beliefs = ["Northfield asked for the moisture waiver to protect its volume commitments."]

