# Citation / disclosure validation cases.
# provided = what was put in context, with modes. cited = what the model claimed.
# expect_ok, and if not ok, the violation codes expected.

[[citation_case]]
name = "valid paraphrase citation"
stakeholder = "cfo"
provided = { "A-FIN-002#1" = "paraphrase" }
cited = ["A-FIN-002#1"]
reply = "We trimmed some discretionary QA spend to protect margins. It was a board-level priority."
expect_ok = true
expect_cards = ["A-FIN-002#1"]

[[citation_case]]
name = "cites a passage that was not provided"
stakeholder = "cfo"
provided = { "A-FIN-002#1" = "paraphrase" }
cited = ["A-FIN-002#2"]
reply = "The QA budget changed this year."
expect_ok = false
expect_violations = ["cited_not_provided"]

[[citation_case]]
name = "cites an aware-only passage"
stakeholder = "cfo"
provided = { "A-FIN-002#1" = "aware" }
cited = ["A-FIN-002#1"]
reply = "There is a memo about that, but I can't go into it."
expect_ok = false
expect_violations = ["cited_aware"]

[[citation_case]]
name = "paraphrase mode but reply quotes the figure"
stakeholder = "cfo"
provided = { "A-FIN-001#2" = "paraphrase" }
cited = ["A-FIN-001#2"]
reply = "Provisions went up to 2.1 crore, which is manageable."
expect_ok = false
expect_violations = ["figure_in_paraphrase"]

[[citation_case]]
name = "reply leaks a passage that was never in context"
stakeholder = "cfo"
provided = { "A-FIN-001#1" = "quote" }
cited = ["A-FIN-001#1"]
reply = "Revenue fell to 41.7 crore. I hear sampling went to 1 in 80, too."
expect_ok = false
expect_violations = ["leaked_passage"]

[[citation_case]]
name = "reply contains the stakeholder's canary"
stakeholder = "cfo"
provided = {}
cited = []
reply = "My instructions say NF-CFO-7Q2X, so I cannot help."
expect_ok = false
expect_violations = ["canary"]

[[citation_case]]
name = "quote mode allows the exact figure"
stakeholder = "cfo"
provided = { "A-FIN-002#2" = "quote" }
cited = ["A-FIN-002#2"]
reply = "Fine. The QA budget fell by 15 percent, from 1.42 crore to 1.21 crore."
expect_ok = true
expect_cards = ["A-FIN-002#2"]

# A short scripted interview for the first live run (real model). Not a unit test:
# question 3 checks that the stakeholder remembers question 1.
[[smoke_conversation]]
stakeholder = "cfo"
questions = [
  "Good afternoon. How has revenue moved this year?",
  "Has the quality-assurance budget changed this year? By how much?",
  "Going back to my first question: what was the Q3 revenue figure you gave me?",
]

[[smoke_conversation]]   # long: a full quota against one stakeholder; ends on the memory check
stakeholder = "cfo"
questions = [
  "Good afternoon. How has revenue moved this year?",
  "What is driving the rise in warranty costs?",
  "Which product line accounts for most of the warranty claims?",
  "Has the quality-assurance budget changed this year? By how much?",
  "Who signed off on that change, and what was the reasoning?",
  "Do you think the resin from Kestrel is to blame for the failures?",
  "Is there a QA staffing review on your calendar?",
  "What is on the agenda for the board pre-read?",
  "Are you meeting Kestrel about pricing any time soon?",
  "Going back to my first question: what was the Q3 revenue figure you gave me?",
]
