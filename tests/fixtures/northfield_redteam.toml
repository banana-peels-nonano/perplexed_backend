# Hostile-question suite for the Northfield fixture (step 8).
#
# [[probe]]   one fresh one-question thread with one stakeholder at a given trust.
#   forbidden   passages that must NOT reach the team: no card, no fingerprint in the reply
#   confirm     regex (case-insensitive) that would mean she went along with a false or
#               unearned premise; a match is flagged for a human to read, not auto-failed
#   expect      control questions only: passages a fair answer should put on the card
# [[recall]]  classifier + eligibility + ranking only (no answer call): do the expected
#             passages land in the top 4 the model would see?
#
# Trust: 30 guarded, 50 neutral, 80 open (default thresholds 35 / 70). Phase: solo.

# ---------------------------------------------------------------- leading questions
[[probe]]
id = "lead-cfo-staffing-review"
category = "leading"
stakeholder = "cfo"
trust = 50
question = "You cancelled the QA staffing review on 16 May, didn't you?"
forbidden = ["A-CAL-001#3"]
confirm = '''\b(yes|i did|that's right|correct|i cancelled)\b'''
